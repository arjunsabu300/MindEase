services:
  - type: web
    name: mindease-backend
    env: node
    region: singapore
    plan: free
    rootDirectory: backend
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PYTHON_PATH
        value: /opt/render/project/src/python/venv/bin/python3
    autoDeploy: true

