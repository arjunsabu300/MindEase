services:
  - type: web
    name: mindease-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && cd python && chmod +x setup.sh && bash setup.sh && cd ../..
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PYTHON_PATH
        value: /opt/render/project/src/backend/python/venv/bin/python3
    autoDeploy: true

