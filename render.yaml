services:
  - type: web
    name: mindease-backend
    env: docker
    region: singapore
    plan: free
    rootDirectory: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PYTHON_PATH
        value: /app/python/venv/bin/python3
    autoDeploy: true

